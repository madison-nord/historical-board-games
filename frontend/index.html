<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Historical Board Games - Play Classic Strategy Games Online</title>
    <meta name="description" content="Play historical board games online - Nine Men's Morris and more classic strategy games with AI and multiplayer modes">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg">
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <div id="app">
        <div id="info-panel-container"></div>
        <canvas id="game-canvas" role="img" aria-label="Nine Men's Morris game board">
            Your browser does not support the canvas element. Please use a modern browser to play.
        </canvas>
        <div id="announcement-container"></div>
        <div id="ui-container"></div>
    </div>
    <script>
        // Polyfill for Node.js 'global' used by sockjs-client
        if (typeof global === 'undefined') {
            window.global = window;
        }
    </script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
