<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1a1a2e"/>
  <!-- Outer square -->
  <rect x="8" y="8" width="48" height="48" rx="2" fill="none" stroke="#4a90e2" stroke-width="2.5"/>
  <!-- Middle square -->
  <rect x="16" y="16" width="32" height="32" rx="1" fill="none" stroke="#4a90e2" stroke-width="2"/>
  <!-- Inner square -->
  <rect x="24" y="24" width="16" height="16" rx="1" fill="none" stroke="#4a90e2" stroke-width="1.5"/>
  <!-- Connecting lines -->
  <line x1="32" y1="8" x2="32" y2="24" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="56" y1="32" x2="40" y2="32" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="32" y1="56" x2="32" y2="40" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="8" y1="32" x2="24" y2="32" stroke="#4a90e2" stroke-width="1.5"/>
  <!-- White pieces -->
  <circle cx="8" cy="8" r="4" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
  <circle cx="32" cy="16" r="3.5" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
  <circle cx="24" cy="32" r="3" fill="#f0f0f0" stroke="#ccc" stroke-width="0.5"/>
  <!-- Dark pieces -->
  <circle cx="56" cy="56" r="4" fill="#333" stroke="#555" stroke-width="0.5"/>
  <circle cx="32" cy="48" r="3.5" fill="#333" stroke="#555" stroke-width="0.5"/>
  <circle cx="40" cy="32" r="3" fill="#333" stroke="#555" stroke-width="0.5"/>
</svg>
