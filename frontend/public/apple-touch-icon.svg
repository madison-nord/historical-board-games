<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <!-- Outer square -->
  <rect x="24" y="24" width="144" height="144" rx="4" fill="none" stroke="#4a90e2" stroke-width="5"/>
  <!-- Middle square -->
  <rect x="48" y="48" width="96" height="96" rx="3" fill="none" stroke="#4a90e2" stroke-width="4"/>
  <!-- Inner square -->
  <rect x="72" y="72" width="48" height="48" rx="2" fill="none" stroke="#4a90e2" stroke-width="3"/>
  <!-- Connecting lines -->
  <line x1="96" y1="24" x2="96" y2="72" stroke="#4a90e2" stroke-width="3"/>
  <line x1="168" y1="96" x2="120" y2="96" stroke="#4a90e2" stroke-width="3"/>
  <line x1="96" y1="168" x2="96" y2="120" stroke="#4a90e2" stroke-width="3"/>
  <line x1="24" y1="96" x2="72" y2="96" stroke="#4a90e2" stroke-width="3"/>
  <!-- White pieces with subtle shadow -->
  <circle cx="24" cy="24" r="11" fill="rgba(0,0,0,0.2)" transform="translate(1.5,1.5)"/>
  <circle cx="24" cy="24" r="11" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <circle cx="96" cy="48" r="10" fill="rgba(0,0,0,0.2)" transform="translate(1.5,1.5)"/>
  <circle cx="96" cy="48" r="10" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <circle cx="72" cy="96" r="9" fill="rgba(0,0,0,0.2)" transform="translate(1.5,1.5)"/>
  <circle cx="72" cy="96" r="9" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  <!-- Dark pieces with subtle shadow -->
  <circle cx="168" cy="168" r="11" fill="rgba(0,0,0,0.3)" transform="translate(1.5,1.5)"/>
  <circle cx="168" cy="168" r="11" fill="#333" stroke="#555" stroke-width="1"/>
  <circle cx="96" cy="144" r="10" fill="rgba(0,0,0,0.3)" transform="translate(1.5,1.5)"/>
  <circle cx="96" cy="144" r="10" fill="#333" stroke="#555" stroke-width="1"/>
  <circle cx="120" cy="96" r="9" fill="rgba(0,0,0,0.3)" transform="translate(1.5,1.5)"/>
  <circle cx="120" cy="96" r="9" fill="#333" stroke="#555" stroke-width="1"/>
</svg>
