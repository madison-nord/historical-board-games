<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Board layout diagram showing three concentric squares with 24 numbered positions">
  <title>Nine Men's Morris Board Layout</title>
  <style>
    .line { stroke: #8B7355; stroke-width: 2; fill: none; }
    .pos { fill: #8B7355; }
    .label { font-family: Arial, sans-serif; font-size: 11px; fill: #5a4a3a; text-anchor: middle; }
  </style>

  <!-- Outer square -->
  <rect x="20" y="20" width="360" height="360" class="line" />
  <!-- Middle square -->
  <rect x="80" y="80" width="240" height="240" class="line" />
  <!-- Inner square -->
  <rect x="140" y="140" width="120" height="120" class="line" />

  <!-- Radial connecting lines (midpoints) -->
  <line x1="200" y1="20" x2="200" y2="140" class="line" />
  <line x1="380" y1="200" x2="260" y2="200" class="line" />
  <line x1="200" y1="380" x2="200" y2="260" class="line" />
  <line x1="20" y1="200" x2="140" y2="200" class="line" />

  <!-- Position circles and labels -->
  <!-- Outer square: 0-7 -->
  <circle cx="20" cy="20" r="8" class="pos" /><text x="20" y="8" class="label">0</text>
  <circle cx="200" cy="20" r="8" class="pos" /><text x="200" y="8" class="label">1</text>
  <circle cx="380" cy="20" r="8" class="pos" /><text x="380" y="8" class="label">2</text>
  <circle cx="380" cy="200" r="8" class="pos" /><text x="395" y="204" class="label">3</text>
  <circle cx="380" cy="380" r="8" class="pos" /><text x="380" y="397" class="label">4</text>
  <circle cx="200" cy="380" r="8" class="pos" /><text x="200" y="397" class="label">5</text>
  <circle cx="20" cy="380" r="8" class="pos" /><text x="20" y="397" class="label">6</text>
  <circle cx="20" cy="200" r="8" class="pos" /><text x="5" y="204" class="label">7</text>

  <!-- Middle square: 8-15 -->
  <circle cx="80" cy="80" r="8" class="pos" /><text x="68" y="72" class="label">8</text>
  <circle cx="200" cy="80" r="8" class="pos" /><text x="215" y="72" class="label">9</text>
  <circle cx="320" cy="80" r="8" class="pos" /><text x="335" y="72" class="label">10</text>
  <circle cx="320" cy="200" r="8" class="pos" /><text x="335" y="204" class="label">11</text>
  <circle cx="320" cy="320" r="8" class="pos" /><text x="335" y="332" class="label">12</text>
  <circle cx="200" cy="320" r="8" class="pos" /><text x="215" y="332" class="label">13</text>
  <circle cx="80" cy="320" r="8" class="pos" /><text x="68" y="332" class="label">14</text>
  <circle cx="80" cy="200" r="8" class="pos" /><text x="65" y="204" class="label">15</text>

  <!-- Inner square: 16-23 -->
  <circle cx="140" cy="140" r="8" class="pos" /><text x="128" y="132" class="label">16</text>
  <circle cx="200" cy="140" r="8" class="pos" /><text x="215" y="132" class="label">17</text>
  <circle cx="260" cy="140" r="8" class="pos" /><text x="275" y="132" class="label">18</text>
  <circle cx="260" cy="200" r="8" class="pos" /><text x="275" y="204" class="label">19</text>
  <circle cx="260" cy="260" r="8" class="pos" /><text x="275" y="272" class="label">20</text>
  <circle cx="200" cy="260" r="8" class="pos" /><text x="215" y="272" class="label">21</text>
  <circle cx="140" cy="260" r="8" class="pos" /><text x="125" y="272" class="label">22</text>
  <circle cx="140" cy="200" r="8" class="pos" /><text x="125" y="204" class="label">23</text>
</svg>