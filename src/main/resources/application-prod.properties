# =============================================================================
# Production Profile Configuration
# Activate with: java -jar app.jar --spring.profiles.active=prod
# Or set environment variable: SPRING_PROFILES_ACTIVE=prod
# =============================================================================

# Server Configuration
server.port=${PORT:8080}

# Logging — reduce verbosity in production
logging.level.root=WARN
logging.level.com.ninemensmorris=INFO

# WebSocket — restrict allowed origins in production
# Set via environment variable for your domain, e.g.:
#   WEBSOCKET_ALLOWED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}

# Spring Boot
spring.application.name=historical-board-games

# Compression — enable gzip for static assets
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
